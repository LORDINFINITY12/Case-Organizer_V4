<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reconnecting — Case Organizer</title>
<!-- Everything is inline on purpose. This page is shown precisely when the
     origin cannot be reached, so it must not depend on a stylesheet, a font or
     an icon that would also fail to load. -->
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #101317;
    --muted: #667085;
    --accent: #34c98a;
    --border: #e6e8ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101317;
      --card: #171b21;
      --text: #e8eaed;
      --muted: #9aa3af;
      --border: #242a33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
  }
  h1 { margin: 0 0 10px; font-size: 1.35rem; }
  p { margin: 0 0 22px; color: var(--muted); font-size: 0.95rem; }
  .spinner {
    width: 34px;
    height: 34px;
    margin: 0 auto 20px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 3s; }
  }
  button {
    width: 100%;
    min-height: 44px;
    padding: 12px 18px;
    font: inherit;
    font-weight: 600;
    color: #0b2c1e;
    background: var(--accent);
    border: 0;
    border-radius: 12px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: default; }
  .status { margin-top: 16px; font-size: 0.82rem; color: var(--muted); min-height: 1.2em; }
</style>
</head>
<body>
  <main class="card">
    <div class="spinner" role="presentation"></div>
    <h1>Reconnecting…</h1>
    <p>Case Organizer is not reachable right now. This page is checking for you and will continue on its own as soon as the connection is back.</p>
    <button id="retry" type="button">Try now</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>

<script>
(function () {
  var statusEl = document.getElementById('status');
  var retryBtn = document.getElementById('retry');
  var attempts = 0;
  var timer = null;

  // Where the container was trying to go before the origin went away, so a
  // recovery lands the user back on their page rather than the dashboard.
  var target = new URLSearchParams(location.search).get('from') || '/';

  function probe() {
    attempts++;
    statusEl.textContent = 'Checking… (attempt ' + attempts + ')';
    // /ping needs no session, so this works whether or not the user is logged
    // in. cache:no-store keeps WebKit from answering from the very cache that
    // caused the problem.
    return fetch('/ping', { cache: 'no-store', credentials: 'same-origin' })
      .then(function (r) {
        if (!r.ok) throw new Error('status ' + r.status);
        statusEl.textContent = 'Back online — reloading.';
        location.replace(target);
        return true;
      })
      .catch(function () {
        statusEl.textContent = 'Still unreachable. Retrying…';
        return false;
      });
  }

  function schedule() {
    // Back off to 15s so a long outage does not sit there hammering the edge,
    // but stay quick early on: tunnel reconnects finish in about 15 seconds.
    var delay = Math.min(3000 + attempts * 1500, 15000);
    clearTimeout(timer);
    timer = setTimeout(tick, delay);
  }

  function tick() {
    probe().then(function (ok) { if (!ok) schedule(); });
  }

  retryBtn.addEventListener('click', function () {
    retryBtn.disabled = true;
    clearTimeout(timer);
    probe().then(function (ok) {
      retryBtn.disabled = false;
      if (!ok) schedule();
    });
  });

  // Re-check the moment the app is brought back to the foreground or the
  // device regains a network, which is usually when the user is looking.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) tick();
  });
  window.addEventListener('online', tick);

  tick();
})();
</script>
</body>
</html>
