<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark">
  <script nonce="{{ csp_nonce }}">
      (function () {
          try {
              const KEY = 'caseOrg.theme';
              const saved = localStorage.getItem(KEY);
              const wantsDark = saved ? (saved === 'dark')
                  : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
              const defaultDark = true;
              const useDark = saved ? (saved === 'dark') : defaultDark || wantsDark;
              if (useDark) document.documentElement.setAttribute('data-theme', 'dark');
          } catch (e) {}
      })();
  </script>
  <title>Case Organizer – {{ bento_title }}</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <style>
    /* Critical inline styles – prevent FOUC while bento CSS + i18n JS load.
       FIX (v4.2.1): Jittery page load — the previous approach used
       opacity: 0 with a 0.2s transition, producing 2-3 visible frames
       of the page fading in.  Switching to visibility: hidden → visible
       is instantaneous (single-frame reveal) while still preventing FOUC
       and preserving layout during the hidden phase. */
    .bento-tool-shell {
      background: #111827; min-height: 100vh; color: #e5e7eb;
      visibility: hidden;
    }
    .bento-tool-shell.bento-ready { visibility: visible; }
  </style>
  {% for tag in bento_head_tags %}
    {{ tag | safe }}
  {% endfor %}
  <link rel="stylesheet" href="{{ static_url('css/style.css') }}" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/Case_Organizer_logo.png') }}" />
  {% include '_pwa_head.html' %}
</head>
<body data-role="{{ current_user.role if current_user else '' }}">
  <div class="app-shell">
    <header class="topbar">
      <a href="{{ url_for('home') }}" class="brand">Case Organizer</a>
      <div class="spacer"></div>
      {% if current_user %}
        <div class="user" data-user-menu>
          <span class="user-menu-toggle"
                role="button"
                tabindex="0"
                data-user-menu-toggle
                aria-haspopup="menu"
                aria-expanded="false"
                aria-label="Toggle account menu"
                title="Account menu">
            <span class="user-email-display">{{ current_user.email }}</span>
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </span>
          <div class="user-menu-panel" data-user-menu-panel role="menu" hidden>
            {% include "_user_menu.html" %}
          </div>
        </div>
      {% endif %}
      {% if not current_user %}
        <div class="user">Guest</div>
      {% endif %}
      <button id="theme-toggle" class="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
        <i class="fa-solid fa-moon"></i>
      </button>
      <form method="post" action="{{ url_for('logout') }}" class="logout-form">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="logout" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </form>
    </header>

    <main class="home enter-animate bento-tool-page">
      {% include "_flash.html" %}

      <section class="bento-tool-shell {{ bento_body_class }}" aria-label="{{ bento_title }}">
        {{ bento_body }}
      </section>
    </main>
  </div>

  <script nonce="{{ csp_nonce }}">
    window.CaseOrg = Object.assign(window.CaseOrg || {}, {
      isAdmin: {{ (current_user and current_user.role == 'admin') | tojson }}
    });
  </script>
  <script src="{{ static_url('js/main.js') }}"></script>
  <script nonce="{{ csp_nonce }}">
    document.addEventListener("DOMContentLoaded", () => {
      const shell = document.querySelector(".bento-tool-shell");
      if (shell) shell.classList.add("bento-ready");

      const backBtn = document.getElementById("back-to-tools");
      if (backBtn) {
        backBtn.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopImmediatePropagation();
          window.location.href = {{ bento_back_url | tojson }};
        }, true);
      }
    });

    // BentoPDF's JS renders tool links at the site root (/merge-pdf.html);
    // under Case Organizer the suite lives at /bento/.  Rewrite such
    // navigations on click — covers the dynamically rendered tools grid,
    // search results, and any in-tool cross-links.  A server-side 404
    // fallback (app.py) catches non-anchor navigations the same way.
    document.addEventListener("click", (event) => {
      const anchor = event.target.closest && event.target.closest("a[href]");
      if (!anchor) return;
      const href = anchor.getAttribute("href");
      if (/^\/[A-Za-z0-9._-]+\.html([?#].*)?$/.test(href)) {
        event.preventDefault();
        window.location.assign("/bento" + href);
      }
    }, true);
  </script>
</body>
</html>
