<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark">
  <script nonce="{{ csp_nonce }}">
      (function () {
          try {
              const KEY = 'caseOrg.theme';
              const saved = localStorage.getItem(KEY);
              const wantsDark = saved ? (saved === 'dark')
                  : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
              const defaultDark = true;
              const useDark = saved ? (saved === 'dark') : defaultDark || wantsDark;
              if (useDark) document.documentElement.setAttribute('data-theme', 'dark');
          } catch (e) {}
      })();
  </script>
  <title>Case Organizer – Files</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="{{ static_url('css/style.css') }}" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/Case_Organizer_logo.png') }}" />
  <meta name="csrf-token" content="{{ csrf_token }}">
  {% include '_pwa_head.html' %}
</head>
<body data-role="{{ current_user.role if current_user else '' }}">
  <div class="app-shell">
    <header class="topbar">
      <a href="{{ url_for('home') }}" class="brand">Case Organizer</a>
      <div class="spacer"></div>
      {% if current_user %}
        <div class="user" data-user-menu>
          <span class="user-menu-toggle"
                role="button"
                tabindex="0"
                data-user-menu-toggle
                aria-haspopup="menu"
                aria-expanded="false"
                aria-label="Toggle account menu"
                title="Account menu">
            <span class="user-email-display">{{ current_user.email }}</span>
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </span>
          <div class="user-menu-panel" data-user-menu-panel role="menu" hidden>
            {% include "_user_menu.html" %}
          </div>
        </div>
      {% endif %}
      <button id="theme-toggle" class="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
        <i class="fa-solid fa-moon"></i>
      </button>
      <form method="post" action="{{ url_for('logout') }}" class="logout-form">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="logout" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </form>
    </header>

    <main class="files-page">
      {% include "_flash.html" %}

      <div class="files-shell">
        <!-- ── Sidebar ─────────────────────────────────────────────── -->
        <aside class="files-side" aria-label="Files navigation">
          <div class="files-new-wrap">
            <button type="button" id="files-new" class="files-new" aria-haspopup="menu" aria-expanded="false">
              <i class="fa-solid fa-plus" aria-hidden="true"></i><span>New</span>
            </button>
          </div>

          <nav class="files-nav" aria-label="Sections">
            <button type="button" class="files-navitem active" data-nav="all">
              <i class="fa-solid fa-folder" aria-hidden="true"></i><span>All cases</span>
            </button>
            <button type="button" class="files-navitem" data-nav="recent">
              <i class="fa-regular fa-clock" aria-hidden="true"></i><span>Recent</span>
            </button>
            <button type="button" class="files-navitem" data-nav="starred">
              <i class="fa-regular fa-star" aria-hidden="true"></i><span>Starred</span>
            </button>
          </nav>

          <div class="files-side-sep"></div>
          <div class="files-side-label">Years</div>
          <nav class="files-years" id="files-years" aria-label="Years"></nav>

          <div class="files-side-foot">
            <div class="files-storage-bar"><span id="files-storage-fill"></span></div>
            <div class="files-storage-text" id="files-storage-text">&nbsp;</div>
          </div>
        </aside>

        <!-- ── Content ─────────────────────────────────────────────── -->
        <section class="files-main" aria-label="Files">
          <div class="files-head">
            <nav class="files-crumbs" id="files-crumbs" aria-label="Breadcrumb"></nav>
            <div class="files-head-right">
              <button type="button" id="files-view-list" class="files-iconbtn active" title="List view" aria-label="List view"><i class="fa-solid fa-list" aria-hidden="true"></i></button>
              <button type="button" id="files-view-grid" class="files-iconbtn" title="Grid view" aria-label="Grid view"><i class="fa-solid fa-table-cells-large" aria-hidden="true"></i></button>
              <button type="button" id="files-info-toggle" class="files-iconbtn" title="Details" aria-label="Details"><i class="fa-solid fa-circle-info" aria-hidden="true"></i></button>
            </div>
          </div>

          <div class="files-chips" id="files-chips">
            <div class="files-chip-wrap"><select id="files-chip-type" aria-label="Type">
              <option value="">Type</option>
              <option value="folder">Folders</option>
              <option value="pdf">PDFs</option>
              <option value="docx">Documents</option>
              <option value="image">Images</option>
            </select></div>
            <div class="files-chip-wrap"><select id="files-chip-modified" aria-label="Modified">
              <option value="">Modified</option>
              <option value="7">Last 7 days</option>
              <option value="30">Last 30 days</option>
              <option value="365">This year</option>
            </select></div>
            <div class="files-chip-wrap"><select id="files-chip-sort" aria-label="Sort by">
              <option value="name">Name</option>
              <option value="modified">Last modified</option>
              <option value="size">File size</option>
              <option value="type">File type</option>
            </select></div>
            <input type="search" id="files-filter" class="files-filter" placeholder="Search in this folder" aria-label="Search in this folder" />
            <button type="button" id="files-chips-clear" class="files-chip-clear" hidden>Clear filters</button>
          </div>

          <div class="files-selbar" id="files-selbar" hidden>
            <span id="files-selcount">0 selected</span>
            <div class="files-selactions">
              <button type="button" id="files-sel-download" class="files-iconbtn" title="Download as ZIP" aria-label="Download as ZIP"><i class="fa-solid fa-download" aria-hidden="true"></i></button>
              <button type="button" id="files-sel-move" class="files-iconbtn" title="Move to" aria-label="Move to"><i class="fa-solid fa-folder-open" aria-hidden="true"></i></button>
              <button type="button" id="files-sel-delete" class="files-iconbtn danger" title="Delete" aria-label="Delete" hidden><i class="fa-solid fa-trash" aria-hidden="true"></i></button>
              <button type="button" id="files-sel-clear" class="files-iconbtn" title="Clear selection" aria-label="Clear selection"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
            </div>
          </div>

          <div class="files-table" id="files-table">
            <div class="files-thead" id="files-thead">
              <span class="files-col-check"><input type="checkbox" id="files-check-all" aria-label="Select all" /></span>
              <button type="button" class="files-th" data-sort="name">Name <i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>
              <button type="button" class="files-th files-col-owner" data-sort="owner">Owner</button>
              <button type="button" class="files-th files-col-mod" data-sort="modified">Date modified <i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>
              <button type="button" class="files-th files-col-size" data-sort="size">File size <i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>
              <span class="files-col-actions"></span>
            </div>
            <div id="files-body" class="files-body" aria-live="polite"></div>
          </div>

          <div class="files-dropveil" id="files-dropveil" hidden>
            <div><i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i><p>Drop files to upload here</p></div>
          </div>
        </section>

        <!-- ── Details panel ───────────────────────────────────────── -->
        <aside class="files-info" id="files-info" hidden aria-label="Details">
          <div class="files-info-head">
            <h3 id="files-info-title">Details</h3>
            <button type="button" id="files-info-close" class="files-iconbtn" aria-label="Close details"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
          </div>
          <div id="files-info-body" class="files-info-body"></div>
        </aside>
      </div>

      <input type="file" id="files-input" hidden multiple />
      <input type="file" id="files-replace-input" hidden />
      <button type="button" id="files-fab" class="files-fab" aria-label="Upload files" title="Upload files" hidden>
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
      </button>
    </main>
  </div>

  <!-- openConfirm() degrades to window.confirm without this block. -->
  <div class="modal" id="confirmModal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-content">
      <div class="modal-head">
        <h3 id="confirmTitle">Confirm Delete</h3>
        <button class="btn-ghost" id="confirmClose" aria-label="Close">&#10005;</button>
      </div>
      <div id="confirmText" style="padding: 6px 2px;">Do you want to delete this file?</div>
      <div class="modal-actions">
        <button id="confirmYes" class="btn-primary">Yes</button>
        <button id="confirmNo" class="btn-ghost">No</button>
      </div>
    </div>
  </div>

  <script nonce="{{ csp_nonce }}">
    window.CaseOrg = Object.assign(window.CaseOrg || {}, {
      isAdmin: {{ (current_user and current_user.role == 'admin') | tojson }},
      role: {{ (current_user.role if current_user else '') | tojson }},
      standardSubdirs: {{ standard_subdirs | tojson }}
    });
  </script>
  <script src="{{ static_url('js/main.js') }}"></script>
  <script src="{{ static_url('js/files.js') }}"></script>
</body>
</html>
