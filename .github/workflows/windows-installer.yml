# Builds the Windows installer and (on release publish) attaches it to the
# release.  Uses the SAME windows/build.ps1 the maintainer runs locally.
#
# Triggers:
#   * release published  -> build + upload CaseOrganizer-Setup-<ver>.exe
#   * workflow_dispatch  -> build + keep the exe as a workflow artifact

name: Windows installer

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  test:
    # The full pytest suite on Windows is the 1:1 feature-parity gate.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: pytest -q

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write        # release asset upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache vendor downloads
        uses: actions/cache@v4
        with:
          path: windows/.cache
          key: vendor-${{ hashFiles('windows/build.ps1') }}
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: pwsh windows/build.ps1
      - name: Upload to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-Item dist/*.exe).FullName --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*.exe
          compression-level: 0
